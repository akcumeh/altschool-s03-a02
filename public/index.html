<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Birthday Reminder</title>
    <link rel="icon" href="/assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@300;400;600;700&display=swap" rel="stylesheet" />
    <style>
        /* palette: #060930  #333456  #595B83  #F4ABC4 */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Overpass', sans-serif;
            min-height: 100vh;
            background: #060930;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        .app-footer {
            padding: 1.25rem 1.5rem;
            border-top: 1px solid rgba(89, 91, 131, 0.3);
        }

        .app-footer__inner {
            max-width: 600px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .app-footer__credit {
            font-size: 0.875rem;
            color: rgba(255, 255, 255, 0.3);
            font-weight: 300;
        }

        .app-footer__links {
            display: flex;
            align-items: center;
            gap: 0.85rem;
        }

        .app-footer__links a {
            display: flex;
            align-items: center;
            color: rgba(255, 255, 255, 0.35);
            transition: color 0.2s;
            text-decoration: none;
        }

        .app-footer__links a:hover {
            color: #F4ABC4;
        }

        .app-footer__logo {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            opacity: 0.5;
            transition: opacity 0.2s;
        }

        .app-footer__links a:hover .app-footer__logo {
            opacity: 1;
        }

        .card {
            background: #333456;
            border-radius: 24px;
            padding: 2.75rem 2.5rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 24px 64px rgba(6, 9, 48, 0.6);
        }

        .card-header {
            margin-bottom: 2rem;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            color: #ffffff;
            line-height: 1.2;
            margin-bottom: 0.4rem;
        }

        span {
            color: #F4ABC4;
        }

        p.subtitle {
            color: rgba(255, 255, 255, 0.45);
            font-size: 0.875rem;
            font-weight: 300;
            line-height: 1.5;
        }

        label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: rgba(255, 255, 255, 0.55);
            margin-bottom: 0.45rem;
        }

        .field {
            margin-bottom: 1.25rem;
        }

        input {
            width: 100%;
            padding: 0.8rem 1.1rem;
            background: #060930;
            border: 1.5px solid #595B83;
            border-radius: 14px;
            font-family: 'Overpass', sans-serif;
            font-size: 0.95rem;
            color: #ffffff;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
            appearance: none;
            -webkit-appearance: none;
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }

        input:focus {
            border-color: #F4ABC4;
            box-shadow: 0 0 0 3px rgba(244, 171, 196, 0.15);
        }

        /* Date picker */
        input[type="date"] {
            color-scheme: dark;
            cursor: pointer;
        }

        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(0.5) sepia(1) saturate(3) hue-rotate(290deg);
            cursor: pointer;
            border-radius: 6px;
            padding: 2px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 0.9rem;
            margin-top: 0.5rem;
            background: #F4ABC4;
            color: #060930;
            border: none;
            border-radius: 14px;
            font-family: 'Overpass', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 0.02em;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        button[type="submit"]:hover {
            background: #f096b4;
        }

        button[type="submit"]:active {
            transform: scale(0.98);
        }

        button[type="submit"]:disabled {
            background: #595B83;
            color: rgba(255, 255, 255, 0.4);
            cursor: not-allowed;
            transform: none;
        }

        /* Success state — replaces the form */
        .success-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            text-align: center;
            padding: 1rem 0;
        }

        .success-icon {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(244, 171, 196, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5rem;
            font-size: 2rem;
        }

        .success-screen h2 {
            font-size: 1.4rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
        }

        .success-screen p {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            line-height: 1.6;
        }

        .success-screen p strong {
            color: #F4ABC4;
        }

        .btn-again {
            margin-top: 1.75rem;
            padding: 0.65rem 1.5rem;
            background: transparent;
            border: 1.5px solid #595B83;
            border-radius: 12px;
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Overpass', sans-serif;
            font-size: 0.875rem;
            cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }

        .btn-again:hover {
            border-color: #F4ABC4;
            color: #F4ABC4;
        }

        /* Inline error message */
        #errorMsg {
            display: none;
            margin-top: 0.85rem;
            padding: 0.75rem 1rem;
            background: rgba(244, 100, 100, 0.12);
            border: 1px solid rgba(244, 100, 100, 0.3);
            border-radius: 10px;
            color: #f49090;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>

<body>
<main>
    <div class="card">
        <div id="formView">
            <div class="card-header">
                <h1>We'll never miss a <span>birthday</span> again.</h1>
                <p class="subtitle">We'll send you a personalised email every year on your special day.</p>
            </div>

            <form id="registerForm">
                <div class="field">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="user_name" required />
                </div>

                <div class="field">
                    <label for="email">Email address</label>
                    <input type="email" id="email" name="email" placeholder="you@example.com" required />
                </div>

                <div class="field">
                    <label for="date_of_birth">Date of birth</label>
                    <input type="date" id="date_of_birth" name="date_of_birth" required />
                </div>

                <button type="submit" id="submitBtn">Register</button>
                <div id="errorMsg"></div>
            </form>
        </div>

        <div class="success-screen" id="successView">
            <div class="success-icon">🎂</div>
            <h2>You're all set!</h2>
            <p>We'll send a birthday email to <strong id="confirmedEmail"></strong> every year on your special day.</p>
            <button class="btn-again" id="registerAnother">Register another</button>
        </div>

    </div>
</main>

<footer class="app-footer">
    <div class="app-footer__inner">
        <span class="app-footer__credit">Designed &amp; built by Angel Umeh (ALT-SOE-025-3527)</span>
        <nav class="app-footer__links">
            <a href="https://angelumeh.dev" target="_blank" rel="noreferrer" aria-label="angelumeh.dev">
                <img src="/assets/favicon.ico" alt="" class="app-footer__logo" />
            </a>
            <a href="https://github.com/akcumeh/altschool-s03-a02" target="_blank" rel="noreferrer" aria-label="GitHub">
                <svg viewBox="0 0 19 19" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M9.356 1.85C5.05 1.85 1.57 5.356 1.57 9.694a7.84 7.84 0 0 0 5.324 7.44c.387.079.528-.168.528-.376 0-.182-.013-.805-.013-1.454-2.165.467-2.616-.935-2.616-.935-.349-.91-.864-1.143-.864-1.143-.71-.48.051-.48.051-.48.787.051 1.2.805 1.2.805.695 1.194 1.817.857 2.268.649.064-.507.27-.857.49-1.052-1.728-.182-3.545-.857-3.545-3.87 0-.857.31-1.558.8-2.104-.078-.195-.349-1 .077-2.078 0 0 .657-.208 2.14.805a7.5 7.5 0 0 1 1.946-.26c.657 0 1.328.092 1.946.26 1.483-1.013 2.14-.805 2.14-.805.426 1.078.155 1.883.078 2.078.502.546.799 1.247.799 2.104 0 3.013-1.818 3.675-3.558 3.87.284.247.528.714.528 1.454 0 1.052-.012 1.896-.012 2.156 0 .208.142.455.528.377a7.84 7.84 0 0 0 5.324-7.441c.013-4.338-3.48-7.844-7.773-7.844" clip-rule="evenodd"/>
                </svg>
            </a>
            <a href="https://twitter.com/akcumeh" target="_blank" rel="noreferrer" aria-label="X / Twitter">
                <svg viewBox="0 0 19 19" width="18" height="18" fill="currentColor" aria-hidden="true">
                    <path fill-rule="evenodd" d="M1.893 1.98c.052.072 1.245 1.769 2.653 3.77l2.892 4.114c.183.261.333.48.333.486s-.068.089-.152.183l-.522.593-.765.867-3.597 4.087c-.375.426-.734.834-.798.905a1 1 0 0 0-.118.148c0 .01.236.017.664.017h.663l.729-.83c.4-.457.796-.906.879-.999a692 692 0 0 0 1.794-2.038c.034-.037.301-.34.594-.675l.551-.624.345-.392a7 7 0 0 1 .34-.374c.006 0 .93 1.306 2.052 2.903l2.084 2.965.045.063h2.275c1.87 0 2.273-.003 2.266-.021-.008-.02-1.098-1.572-3.894-5.547-2.013-2.862-2.28-3.246-2.273-3.266.008-.019.282-.332 2.085-2.38l2-2.274 1.567-1.782c.022-.028-.016-.03-.65-.03h-.674l-.3.342a871 871 0 0 1-1.782 2.025c-.067.075-.405.458-.75.852a100 100 0 0 1-.803.91c-.148.172-.299.344-.99 1.127-.304.343-.32.358-.345.327-.015-.019-.904-1.282-1.976-2.808L6.365 1.85H1.8zm1.782.91 8.078 11.294c.772 1.08 1.413 1.973 1.425 1.984.016.017.241.02 1.05.017l1.03-.004-2.694-3.766L7.796 5.75 5.722 2.852l-1.039-.004-1.039-.004z" clip-rule="evenodd"/>
                </svg>
            </a>
        </nav>
    </div>
</footer>

    <script>
        const form = document.getElementById('registerForm');
        const formView = document.getElementById('formView');
        const successView = document.getElementById('successView');
        const errorMsg = document.getElementById('errorMsg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Registering…';

            const body = {
                username: document.getElementById('username').value.trim(),
                email: document.getElementById('email').value.trim(),
                date_of_birth: document.getElementById('date_of_birth').value,
            };

            try {
                const res = await fetch('/api/users', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body),
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('confirmedEmail').textContent = body.email;
                    formView.style.display = 'none';
                    successView.style.display = 'flex';
                } else {
                    errorMsg.textContent = data.error || 'Something went wrong. Please try again.';
                    errorMsg.style.display = 'block';
                }
            } catch {
                errorMsg.textContent = 'Network error. Please check your connection.';
                errorMsg.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Register';
            }
        });

        document.getElementById('registerAnother').addEventListener('click', () => {
            form.reset();
            errorMsg.style.display = 'none';
            successView.style.display = 'none';
            formView.style.display = 'block';
        });
    </script>
</body>

</html>
